<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>الحرب 1 — War 1</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&amp;display=swap" rel="stylesheet"><style>
:root{--bg:#14182b;--p:#2b3563;--a:#37d4e6;--t:#f2f6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:var(--t);font-family:Tahoma,system-ui,sans-serif;color-scheme:dark}
.s{display:none;max-width:480px;margin:auto;padding:12px;text-align:center}.s.on{display:block}
h1{font-size:2.2rem;margin:.3em;color:var(--a)}h2{margin:.4em}
button{font:inherit;color:var(--t);background:var(--p);border:2px solid var(--a);border-radius:12px;padding:12px 18px;margin:5px;min-width:150px;cursor:pointer}
button:disabled,button.no{opacity:.45}button:active{transform:scale(.96)}
canvas{width:100%;display:block;border-radius:10px;touch-action:none;background:#000}
.hud{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:.9rem;margin:4px 0}
.bar{height:12px;background:#0006;border-radius:6px;overflow:hidden;flex:1}.bar i{display:block;height:100%;width:100%}
.hp0{background:#3b8cff}.hp1{background:#ff4a4a}.en{background:#ffd23f}
#sum{display:flex;gap:6px;justify-content:center;margin-top:6px}
#sum button{flex:1;min-width:0;padding:6px 2px;position:relative;overflow:hidden;font-size:.8rem}
#sum span{position:absolute;inset:0;background:#000a;transform-origin:bottom;transform:scaleY(0)}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:5}.ov.on{display:flex}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.grid button{min-width:0;padding:14px 2px}
.row{background:var(--p);border-radius:10px;padding:8px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;text-align:right}
.mb{margin:4px;color:#aab}

body:has(#menu.on){background:var(--nv)}
#plq{width:min(92%,440px);aspect-ratio:1050/340;margin:6px auto;background:var(--plq) center/100% 100% no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center}
#plq h1{margin:0;font-size:1.9rem;color:#14305a}#plq small{color:#2a6a8a;letter-spacing:2px}
#menu>br{display:none}
#menu>button,.ov button{display:block;margin:6px auto;width:min(86vw,360px);height:58px;min-width:0;padding:0;border:0;border-radius:0;background:var(--blue) center/100% 100% no-repeat;color:#ffe9a8;font-weight:bold;text-shadow:0 1px 3px #000}
#menu>button:first-of-type{background-image:var(--gold);color:#3a2300;text-shadow:none}
.ov{background:#071433f2}
#rs h2{font-size:2.8rem;margin:.2em;color:#ffd23f;text-shadow:0 0 22px #ffd23f99}#rs[data-r=l] h2{color:#ff5a5a;text-shadow:0 0 22px #ff5a5a88}
.bar{height:14px;border:2px solid #c9a84e;border-radius:8px;background:#05102a}
.hp0{background:linear-gradient(#6fd3ff,#2a7de0)}.hp1{background:linear-gradient(#ff8a6a,#c0302a)}.en{background:linear-gradient(#aff,#37d4e6);box-shadow:0 0 8px #37d4e6}
.gem{display:inline-block;width:12px;height:16px;background:linear-gradient(135deg,#cff,#37d4e6 60%,#0a7a9a);clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);vertical-align:middle;filter:drop-shadow(0 0 4px #37d4e6);animation:gp 1.4s infinite alternate}
@keyframes gp{to{transform:scale(1.2) rotate(8deg)}}
.ic{display:inline-block;width:18px;height:18px;border-radius:50%;background:#06070a;border:2px solid var(--c);vertical-align:middle;margin-left:4px}
#sum button{background:linear-gradient(#1b2a52,#0a1430);border:2px solid #c9a84e}
html,body{font-family:Cairo,Tahoma,system-ui,sans-serif}
.s.on{animation:fi .35s ease}@keyframes fi{from{opacity:0;transform:translateY(10px)}}
button{transition:transform .15s,filter .15s}button:hover:not(:disabled){transform:translateY(-2px) scale(1.03);filter:brightness(1.2)}
#bat{direction:ltr}#lgrow{display:flex;justify-content:center;gap:6px}
#lgrow button{height:52px;width:min(42vw,175px);min-width:0;padding:0;border:0;border-radius:0;background:var(--blue) center/100% 100% no-repeat;color:#ffe9a8;font-weight:bold}
#ts{position:fixed;top:14%;left:50%;transform:translateX(-50%);background:#000c;border:2px solid #f55;border-radius:10px;padding:8px 16px;display:none;z-index:9}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#rot{display:none;color:#ffd23f;font-size:.85rem;margin:4px}
@media (orientation:landscape) and (max-height:520px){#rot{display:block}}

#logo{display:block;width:min(92%,380px);margin:4px auto;animation:lg 3s ease-in-out infinite alternate}
@keyframes lg{from{filter:drop-shadow(0 0 6px #ff9a00)}to{filter:drop-shadow(0 0 20px #ffd23f)}}
.em{animation:rise 3s linear infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-90px);opacity:0}}
@media (max-width:600px){.hud{font-size:.72rem;gap:4px}.hud span{display:none}#sum button{font-size:.62rem}}
#bat.on{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;padding:0;max-width:none;z-index:1;animation:none}
#vp{position:relative;width:min(100vw,calc(100vh*9/16));width:min(100vw,calc(100dvh*9/16));aspect-ratio:9/16;max-height:100vh;overflow:hidden}
#vp canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
#vp .top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 14px;background:linear-gradient(#000b,#0000);z-index:2;margin:0}
#vp .low{position:absolute;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:2;margin:0}
#sum{position:absolute;left:0;right:0;bottom:0;margin:0;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);background:linear-gradient(#0000,#000d 30%);z-index:2}
#rot{position:absolute;top:56px;left:0;right:0;z-index:3;margin:0}
.s.on:not(#bat){min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.s.on:not(#bat)>*{max-width:100%}#sg,#ul,#uc,#stg>div{width:100%}
#logo2{text-align:center;margin:0 auto}
#logo2 img{display:block;width:min(78%,300px);margin:0 auto;animation:lg 3s ease-in-out infinite alternate,fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
#logo2 b{display:block;font-size:2.6rem;font-weight:900;line-height:1.1;background:linear-gradient(#fff6b0,#ffc83a 50%,#a65a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #2a1400)}
